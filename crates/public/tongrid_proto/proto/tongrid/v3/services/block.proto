syntax = "proto3";

package tongrid.v3;

import "tongrid/v3/types.proto";
import "tongrid/v3/range.proto";

service BlockGrpc {
  rpc GetBlocksShards(GetBlocksShardsRequest) returns (GetBlocksShardsResponse) {}
  rpc GetShard(GetShardRequest) returns (GetShardResponse) {}
}

message GetBlocksShardsRequest {
  // Required inclusive range of at most 100 masterchain seqnos. Missing,
  // inverted, or oversized ranges return InvalidArgument. Validation precedes
  // the existing clamp of each endpoint to INT32_MAX.
  McSeqnoRange mc_seqno_range = 1;
  optional bool boc_required = 10;
}

message GetBlocksShardsResponse {
  // sorting is not guaranteed
  repeated BlockShard shards = 1;
}

message GetShardRequest {
  uint32 mc_seqno = 1;
  sint32 workchain = 2;
  uint64 shard = 3;
  uint32 seqno = 4;
  optional bool boc_required = 10;
}

message GetShardResponse {
  BlockShard shard = 1;
}
