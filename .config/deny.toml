[graph]
all-features = true

[licenses]
confidence-threshold = 0.95
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]

# Exact dependency-specific licenses; these do not change our Apache-2.0 license.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# publish=false is not an exemption from checking source-distributed libraries.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ston-fi/ton-labs-block.git",
    "https://github.com/ston-fi/ton-labs-types.git",
    "https://github.com/broxus/ed25519-dalek.git",
]
# Two legacy upstream manifests omit rev. Review resolved commits in Cargo.lock;
# project-owned manifests still require a full rev.
required-git-spec = "any"

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Maintenance-only: preserve existing bincode 2 sync task wire encoding; replacing it needs a separate compatibility migration." },
    { id = "RUSTSEC-2024-0388", reason = "Maintenance-only derivative is inherited from the locked legacy TON codec; no vulnerable-code advisory is suppressed." },
    { id = "RUSTSEC-2024-0320", reason = "Maintenance-only yaml-rust is inherited from the locked legacy TON codec; application Config parsing is private and does not use this parser." },
]
